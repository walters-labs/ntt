name: basic

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check formatting and lint
      run: |
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings

    - name: Test debug and release arithmetic
      run: |
        cargo test --verbose
        cargo test --release --verbose
